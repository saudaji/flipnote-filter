<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLIP STAGE · salida</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 6%; transform: translateX(-50%); padding: 10px 16px; border-radius: 99px;
    background: rgba(20, 20, 22, .82); color: #f4f1ea; font: 600 14px/1 system-ui, sans-serif; letter-spacing: .02em; white-space: nowrap;
    transition: opacity .6s; pointer-events: none;
  }
  body.quiet { cursor: none; }
  body.quiet #hint { opacity: 0; }
</style>
</head>
<body>
<canvas id="out" width="1280" height="720"></canvas>
<div id="hint">FLIP STAGE</div>
<script>
// Ventana de salida de FLIP STAGE. No dibuja nada por sí misma: la consola (la ventana que la
// abrió) pinta aquí cada cuadro y usa el reloj de esta ventana, así la salida no se frena aunque
// la consola quede tapada. Doble clic o F: pantalla completa. 1–8, espacio y B llegan a la consola.
(function () {
  'use strict';
  var hint = document.getElementById('hint'), timer = 0;
  function host() { try { return window.opener && window.opener.flipStage ? window.opener.flipStage : null; } catch (error) { return null; } }
  function say(text) {
    hint.textContent = text;
    document.body.classList.remove('quiet');
    clearTimeout(timer);
    timer = setTimeout(function () { document.body.classList.add('quiet'); }, 4200);
  }
  function full() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
  }
  var stage = host();
  if (stage) { stage.output.attach(window); say('Doble clic o F: pantalla completa'); }
  else { hint.textContent = 'Abre esta ventana desde FLIP STAGE, con la tecla SALIDA.'; }
  addEventListener('dblclick', full);
  addEventListener('mousemove', function () { if (stage) say('Doble clic o F: pantalla completa'); });
  addEventListener('keydown', function (event) {
    if (event.key === 'f' || event.key === 'F') { full(); return; }
    var target = host();
    if (target) target.key(event.key);
  });
  // El ratón sobre la salida es el mismo pad XY que el monitor de la consola.
  addEventListener('pointermove', function (event) {
    var target = host();
    if (target && event.buttons) target.pad(event.clientX / innerWidth, 1 - event.clientY / innerHeight);
  });
  addEventListener('pagehide', function () { var target = host(); if (target) target.output.detach(window); });
})();
</script>
</body>
</html>
